services:
  db:
    image: mariadb:11
    container_name: orchestrateur-db
    environment:
      MARIADB_ROOT_PASSWORD: orchestrateur_root
      MARIADB_USER: orchestrateur
      MARIADB_PASSWORD: orchestrateur
      MARIADB_DATABASE: orchestrateur
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./db/002_builder.sql:/docker-entrypoint-initdb.d/02-builder.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - agent_mesh

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 5m
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 1
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - agent_mesh

  ollama-init:
    image: ollama/ollama:latest
    container_name: ollama-init
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    command: ["pull", "${OLLAMA_DEFAULT_MODEL:-qwen2.5-coder:1.5b}"]
    restart: "no"
    networks:
      - agent_mesh

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: orchestrateur-backend
    environment:
      ORCHESTRATOR_MODE: compose
      MODEL_BACKEND: ollama
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODELS_DIR: /ollama-models
      OLLAMA_DEFAULT_MODEL: ${OLLAMA_DEFAULT_MODEL:-qwen2.5-coder:1.5b}
      DATABASE_URL: mysql://orchestrateur:orchestrateur@db:3306/orchestrateur
      JOURNEY_MAX_HISTORY_MESSAGES: "${JOURNEY_MAX_HISTORY_MESSAGES:-40}"
      CATALOG_BACKEND: mariadb
      FRONTEND_URL: http://localhost:3000
      UI_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      WORKSPACE_ROOT: /workspaces
    volumes:
      - ./workspaces:/workspaces
      - ./catalog:/app/catalog:ro
      - ollama_data:/ollama-models:ro
    depends_on:
      db:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    networks:
      - agent_mesh

  workspace-runner:
    build:
      context: .
      dockerfile: workspace-runner/Dockerfile
    container_name: orchestrateur-workspace-runner
    volumes:
      - ./workspaces:/workspaces
    networks:
      - agent_mesh

  trace-service:
    build:
      context: .
      dockerfile: trace-service/Dockerfile
    container_name: orchestrateur-trace
    environment:
      TRACE_BIND_HOST: "0.0.0.0"
      TRACE_PORT: "8090"
      TRACE_CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173"
      TRACE_SQLITE_PATH: /data/traces.sqlite
    volumes:
      - trace_sqlite_data:/data
    ports:
      - "8090:8090"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - agent_mesh

  mcp-server:
    build:
      context: .
      dockerfile: mcp-server/Dockerfile
    container_name: orchestrateur-mcp
    environment:
      ORCHESTRATOR_API_BASE: http://backend:8000
      ORCHESTRATOR_HTTP_TIMEOUT_SECONDS: "${ORCHESTRATOR_HTTP_TIMEOUT_SECONDS:-900}"
      MCP_RELAX_ACCEPT_HEADERS: "${MCP_RELAX_ACCEPT_HEADERS:-true}"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/healthz',timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${MCP_SERVER_PORT:-8010}:8010"
    networks:
      - agent_mesh

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
        VITE_TRACE_SERVICE_URL: http://127.0.0.1:8090
    container_name: orchestrateur-frontend
    depends_on:
      backend:
        condition: service_started
      trace-service:
        condition: service_healthy
    ports:
      - "3000:80"
    networks:
      - agent_mesh

networks:
  agent_mesh:
    name: orchestrateur-agent-mesh
    driver: bridge

volumes:
  ollama_data:
  mariadb_data:
  trace_sqlite_data:
