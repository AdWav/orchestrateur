[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestrateur-local"
version = "0.2.0"
description = "Socle Python-first pour un orchestrateur multi-agents local."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "pymysql>=1.1.0",
  "pydantic>=2.9.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]

[project.scripts]
orchestrateur = "serve.cli:main"

[tool.setuptools]
package-dir = {"" = "backend"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*", "core*", "serve*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "backend"]
