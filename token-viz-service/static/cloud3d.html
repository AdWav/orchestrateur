<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nuage 3D — Token Viz</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #05080f;
        --panel: rgba(14, 20, 30, 0.92);
        --text: #e8edf5;
        --muted: #8b97a8;
        --accent: #4f8cff;
        --chosen: #3ddc97;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        overflow: hidden;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      #canvas-host {
        position: fixed;
        inset: 0;
      }
      .overlay {
        position: fixed;
        z-index: 2;
        pointer-events: none;
      }
      .overlay > * {
        pointer-events: auto;
      }
      header {
        top: 0;
        left: 0;
        right: 0;
        padding: 14px 18px;
        background: linear-gradient(180deg, rgba(5, 8, 15, 0.95), transparent);
      }
      header h1 {
        margin: 0 0 4px;
        font-size: 1.15rem;
      }
      header p {
        margin: 0;
        color: var(--muted);
        font-size: 0.85rem;
      }
      header a {
        color: var(--accent);
      }
      .panel {
        bottom: 16px;
        left: 16px;
        right: 16px;
        max-width: 980px;
        margin: 0 auto;
        padding: 12px;
        border-radius: 12px;
        background: var(--panel);
        border: 1px solid #243044;
        backdrop-filter: blur(8px);
      }
      .controls {
        display: grid;
        grid-template-columns: 1fr 1.2fr auto auto auto;
        gap: 8px;
        align-items: end;
      }
      @media (max-width: 900px) {
        .controls {
          grid-template-columns: 1fr 1fr;
        }
      }
      label {
        display: grid;
        gap: 4px;
        font-size: 0.75rem;
        color: var(--muted);
      }
      input,
      textarea,
      select,
      button {
        font: inherit;
      }
      input,
      textarea,
      select {
        width: 100%;
        background: #0b111a;
        color: var(--text);
        border: 1px solid #2a3547;
        border-radius: 8px;
        padding: 7px 9px;
      }
      textarea {
        min-height: 52px;
        resize: vertical;
      }
      button {
        background: var(--accent);
        color: #fff;
        border: 0;
        border-radius: 8px;
        padding: 9px 14px;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      #hud {
        top: 88px;
        right: 16px;
        width: 240px;
        padding: 12px;
        border-radius: 12px;
        background: var(--panel);
        border: 1px solid #243044;
        font-size: 0.82rem;
        display: none;
      }
      #hud.visible {
        display: block;
      }
      #hud .token {
        font-family: "Cascadia Code", monospace;
        font-size: 1rem;
        margin: 6px 0;
        word-break: break-all;
      }
      #meta {
        margin-top: 8px;
        font-size: 0.78rem;
        color: var(--muted);
      }
      #error {
        color: #ff7b7b;
        font-size: 0.82rem;
        margin-top: 6px;
      }
      .hint {
        margin-top: 8px;
        font-size: 0.72rem;
        color: var(--muted);
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="canvas-host"></div>

    <div class="overlay header">
      <header>
        <h1>Nuage 3D de tokens</h1>
        <p>
          Axe X = temps de génération · plan YZ = projections alternatives (particules).
          <a href="/explainer.html">Explainer</a> ·
          <a href="/tree.html">Vue 2D</a> · <a href="/">BPE</a>
        </p>
      </header>
    </div>

    <div id="hud" class="overlay">
      <div id="hud-kind">—</div>
      <div class="token" id="hud-token">—</div>
      <div id="hud-prob">—</div>
      <div id="hud-logprob">—</div>
    </div>

    <div class="overlay panel">
      <div class="controls">
        <label>
          Modèle
          <input id="model" value="qwen2.5-coder:1.5b" />
        </label>
        <label>
          Prompt
          <textarea id="prompt">Explique en une phrase ce qu'est le top-p.</textarea>
        </label>
        <label>
          Branches
          <select id="topLogprobs">
            <option value="3">3</option>
            <option value="5" selected>5</option>
            <option value="8">8</option>
          </select>
        </label>
        <label>
          Tokens
          <input id="numPredict" type="number" min="4" max="48" value="14" />
        </label>
        <button id="run">Actualiser</button>
      </div>
      <div id="meta">—</div>
      <div id="error" hidden></div>
      <div class="hint">Souris : orbiter · molette : zoom · clic : inspecter une particule</div>
    </div>

    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";

      const $ = (id) => document.getElementById(id);
      const host = $("canvas-host");

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x05080f);
      scene.fog = new THREE.FogExp2(0x05080f, 0.045);

      const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 500);
      camera.position.set(8, 10, 18);

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      host.appendChild(renderer.domElement);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;
      controls.target.set(6, 0, 0);

      scene.add(new THREE.AmbientLight(0x9ab4d0, 0.55));
      const keyLight = new THREE.DirectionalLight(0xffffff, 0.9);
      keyLight.position.set(10, 14, 8);
      scene.add(keyLight);
      const rimLight = new THREE.PointLight(0x3ddc97, 0.65, 80);
      rimLight.position.set(-6, 4, -8);
      scene.add(rimLight);

      const cloudGroup = new THREE.Group();
      const linksGroup = new THREE.Group();
      scene.add(linksGroup);
      scene.add(cloudGroup);

      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();
      const pickables = [];
      let animParticles = [];
      let clock = new THREE.Clock();

      function kindColor(kind, selected) {
        if (kind === "prompt") return new THREE.Color(0x9aa8bc);
        if (kind === "chosen" || selected) return new THREE.Color(0x3ddc97);
        return new THREE.Color(0x5a7cff);
      }

      function flattenDecodeCloud(tree) {
        const particles = [];
        const links = [];
        let spine = { y: 0, z: 0 };
        const golden = Math.PI * (3 - Math.sqrt(5));

        function visit(node, depth, parentId, parentPos, sibIndex, sibCount) {
          const id = particles.length;
          const x = depth * 3.4;
          let y;
          let z;

          if (node.kind === "prompt") {
            y = 0;
            z = 0;
          } else {
            const t = sibIndex + 1;
            const angle = t * golden * 2.4;
            const isChosen = node.kind === "chosen" || node.selected;
            const prob = Math.max(0, Math.min(1, node.probability ?? 0));
            const ring = isChosen ? 0.25 + prob * 0.35 : 1.0 + (1 - prob) * 2.2 + sibIndex * 0.15;
            y = spine.y + Math.cos(angle) * ring;
            z = spine.z + Math.sin(angle) * ring;
            if (isChosen) {
              spine = { y, z };
            }
          }

          const pos = { x, y, z };
          const baseRadius =
            node.kind === "prompt"
              ? 0.42
              : node.kind === "chosen"
                ? 0.2 + (node.probability || 0) * 0.28
                : 0.09 + (node.probability || 0) * 0.16;

          particles.push({
            id,
            parentId,
            kind: node.kind,
            selected: !!node.selected,
            name: node.name,
            raw: node.raw,
            probability: node.probability,
            logprob: node.logprob,
            position: pos,
            basePosition: { ...pos },
            depth,
            radius: baseRadius,
            phase: Math.random() * Math.PI * 2,
            drift: node.kind === "alternative" ? 0.18 : 0.05,
          });

          if (parentId !== null && parentPos) {
            links.push({
              from: parentPos,
              to: pos,
              chosen: node.kind === "chosen" || node.selected,
            });
          }

          const children = node.children || [];
          children.forEach((child, i) => visit(child, depth + 1, id, pos, i, children.length));
        }

        visit(tree, 0, null, null, 0, 1);
        return { particles, links };
      }

      function clearCloud() {
        cloudGroup.clear();
        linksGroup.clear();
        pickables.length = 0;
        animParticles = [];
      }

      function buildCloud(tree) {
        clearCloud();
        const { particles, links } = flattenDecodeCloud(tree);

        for (const link of links) {
          const geometry = new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(link.from.x, link.from.y, link.from.z),
            new THREE.Vector3(link.to.x, link.to.y, link.to.z),
          ]);
          const material = new THREE.LineBasicMaterial({
            color: link.chosen ? 0x2f8f68 : 0x2a3d5c,
            transparent: true,
            opacity: link.chosen ? 0.85 : 0.28,
          });
          linksGroup.add(new THREE.Line(geometry, material));
        }

        for (const p of particles) {
          const geometry = new THREE.SphereGeometry(p.radius, 20, 20);
          const material = new THREE.MeshStandardMaterial({
            color: kindColor(p.kind, p.selected),
            emissive: kindColor(p.kind, p.selected),
            emissiveIntensity: p.kind === "chosen" ? 0.55 : p.kind === "prompt" ? 0.2 : 0.12,
            metalness: 0.15,
            roughness: 0.35,
            transparent: p.kind === "alternative",
            opacity: p.kind === "alternative" ? 0.72 : 1,
          });
          const mesh = new THREE.Mesh(geometry, material);
          mesh.position.set(p.position.x, p.position.y, p.position.z);
          mesh.userData = p;
          cloudGroup.add(mesh);
          pickables.push(mesh);
          animParticles.push({ mesh, data: p });
        }

        if (particles.length > 0) {
          const xs = particles.map((p) => p.position.x);
          const midX = (Math.min(...xs) + Math.max(...xs)) / 2;
          controls.target.set(midX, spineCenter(particles).y, spineCenter(particles).z);
          camera.position.set(midX + 10, 8, 14);
        }
      }

      function spineCenter(particles) {
        const chosen = particles.filter((p) => p.kind === "chosen" || p.kind === "prompt");
        if (chosen.length === 0) return { y: 0, z: 0 };
        const y = chosen.reduce((s, p) => s + p.position.y, 0) / chosen.length;
        const z = chosen.reduce((s, p) => s + p.position.z, 0) / chosen.length;
        return { y, z };
      }

      function showHud(data) {
        $("hud").classList.add("visible");
        $("hud-kind").textContent =
          data.kind === "prompt"
            ? "Prompt"
            : data.kind === "chosen"
              ? "Token choisi"
              : "Projection alternative";
        $("hud-token").textContent = JSON.stringify(data.raw ?? data.name);
        $("hud-prob").textContent =
          typeof data.probability === "number"
            ? `P ≈ ${(data.probability * 100).toFixed(2)} %`
            : "P —";
        $("hud-logprob").textContent =
          typeof data.logprob === "number" ? `logprob = ${data.logprob.toFixed(4)}` : "logprob —";
      }

      function onPointerMove(event) {
        pointer.x = (event.clientX / window.innerWidth) * 2 - 1;
        pointer.y = -(event.clientY / window.innerHeight) * 2 + 1;
      }

      function onClick() {
        raycaster.setFromCamera(pointer, camera);
        const hits = raycaster.intersectObjects(pickables, false);
        if (hits.length > 0) {
          showHud(hits[0].object.userData);
        }
      }

      renderer.domElement.addEventListener("pointermove", onPointerMove);
      renderer.domElement.addEventListener("click", onClick);

      function animate() {
        requestAnimationFrame(animate);
        const t = clock.getElapsedTime();
        for (const item of animParticles) {
          const p = item.data;
          const wobble = Math.sin(t * 1.6 + p.phase) * p.drift;
          item.mesh.position.x = p.basePosition.x;
          item.mesh.position.y = p.basePosition.y + wobble * 0.35;
          item.mesh.position.z = p.basePosition.z + Math.cos(t * 1.3 + p.phase) * p.drift * 0.35;
          if (p.kind === "alternative") {
            item.mesh.rotation.y = t * 0.4 + p.phase;
          }
        }
        controls.update();
        renderer.render(scene, camera);
      }
      animate();

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      async function run() {
        $("error").hidden = true;
        $("run").disabled = true;
        $("meta").textContent = "Génération Ollama + construction du nuage…";
        try {
          const response = await fetch("/v1/decode/tree", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              model: $("model").value.trim(),
              prompt: $("prompt").value,
              top_logprobs: Number($("topLogprobs").value),
              num_predict: Number($("numPredict").value),
            }),
          });
          const payload = await response.json();
          if (!response.ok) {
            throw new Error(payload.detail || "decode/tree failed");
          }
          buildCloud(payload.tree);
          $("meta").textContent = `${payload.token_steps} particules-temps · ${pickables.length} sphères · ${payload.response || ""}`;
        } catch (error) {
          $("error").textContent = error.message;
          $("error").hidden = false;
        } finally {
          $("run").disabled = false;
        }
      }

      $("run").addEventListener("click", run);
      run();
    </script>
  </body>
</html>
