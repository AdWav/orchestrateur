[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestrateur-trace-service"
version = "0.1.0"
description = "Service HTTP de traces conversationnelles (spans par phase intent -> reponse)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.0.0",
]

[project.scripts]
orchestrateur-trace = "orchestrateur_trace.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["orchestrateur_trace*"]
